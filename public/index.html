<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Parlay Builder</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand">
      <h1>Parlay Builder</h1>
      <span id="week-label" class="muted"></span>
      <button id="refresh" class="refresh" type="button" hidden>↻ Refresh lines</button>
    </div>
    <div id="who" class="who"></div>
  </header>

  <div id="notice" class="notice" hidden></div>

  <section id="join" class="card join" hidden>
    <h2>Who are you?</h2>
    <div id="player-list" class="chips"></div>
    <div id="code-row" class="row" hidden>
      <input id="group-code" placeholder="Group code" autocomplete="off">
      <button id="code-save" type="button">Save code</button>
    </div>
  </section>

  <nav id="tabs" class="tabs" hidden>
    <button data-tab="picks" class="active">Picks</button>
    <button data-tab="board">Board</button>
    <button data-tab="parlays">Parlays</button>
    <button data-tab="slip">Bet Slip</button>
    <button data-tab="stats">Stats</button>
  </nav>

  <main>
    <section id="tab-picks" class="tab">
      <div class="mode-switch" role="tablist">
        <button type="button" data-mode="picks" class="active">My picks</button>
        <button type="button" data-mode="calc">Payout calculator</button>
      </div>
      <p id="picks-hint" class="muted small"></p>
      <p id="schedule-meta" class="muted small meta"></p>
      <div id="games"></div>
    </section>

    <section id="tab-board" class="tab" hidden>
      <div id="board"></div>
    </section>

    <section id="tab-parlays" class="tab" hidden>
      <p class="muted small">Put in how much you want on the parlays you like. The person placing the bets sees it all on the Bet Slip tab.</p>
      <div id="parlays"></div>
    </section>

    <section id="tab-slip" class="tab" hidden>
      <div id="slip"></div>
    </section>

    <section id="tab-stats" class="tab" hidden>
      <div id="stats"></div>
    </section>
  </main>

  <div id="submit-bar" class="submit-bar" hidden></div>


  <script src="app.js" type="module"></script>
</body>
</html>
