<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Parlay Builder</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <!-- Add to Home Screen (iPhone): the icon, its label, and opening full screen like an app. -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Parlays">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0f1419">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&display=block">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Gold for lock icons, with a shine that sweeps across. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff4b8"/>
        <stop offset=".3" stop-color="#f7cd4a"/>
        <stop offset=".65" stop-color="#d99a1e"/>
        <stop offset="1" stop-color="#8f5c00"/>
      </linearGradient>
      <linearGradient id="gold-shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="10" y2="10">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/>
        <stop offset=".5" stop-color="#fff" stop-opacity=".9"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        <animateTransform attributeName="gradientTransform" type="translate" values="-24 -24; 30 30; 30 30" keyTimes="0; .45; 1" dur="2.6s" repeatCount="indefinite"/>
      </linearGradient>
    </defs>
  </svg>
  <header>
    <div class="brand">
      <!-- The site's name rises out of a floor line with a football beside it,
           a mirror reflection below, then shines once. -->
      <h1 class="logo" aria-label="Parlay Builder">
        <span class="logo-stage"><span class="logo-rise">
          <svg class="logo-ball" viewBox="0 -1 64 42" aria-hidden="true">
            <defs><radialGradient id="ball-skin" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#b8682f"/><stop offset=".6" stop-color="#7a3b12"/><stop offset="1" stop-color="#4a2208"/></radialGradient></defs>
            <g transform="rotate(-28 32 20)">
              <ellipse cx="32" cy="20" rx="29" ry="16" fill="url(#ball-skin)" stroke="#2e1503" stroke-width="1.5"/>
              <path d="M12 9.5q2 10.5 0 21M52 9.5q-2 10.5 0 21" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>
              <path d="M22 20h20M25 16.5v7M29 16.5v7M33 16.5v7M37 16.5v7" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
            </g>
          </svg>
          <span class="logo-word">PARLAY BUILDER</span>
        </span></span>
        <span class="logo-stage logo-reflect" aria-hidden="true"><span class="logo-rise">
          <svg class="logo-ball" viewBox="0 -1 64 42" aria-hidden="true">
            <defs><radialGradient id="ball-skin-r" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#b8682f"/><stop offset=".6" stop-color="#7a3b12"/><stop offset="1" stop-color="#4a2208"/></radialGradient></defs>
            <g transform="rotate(-28 32 20)">
              <ellipse cx="32" cy="20" rx="29" ry="16" fill="url(#ball-skin-r)" stroke="#2e1503" stroke-width="1.5"/>
              <path d="M12 9.5q2 10.5 0 21M52 9.5q-2 10.5 0 21" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>
              <path d="M22 20h20M25 16.5v7M29 16.5v7M33 16.5v7M37 16.5v7" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
            </g>
          </svg>
          <span class="logo-word">PARLAY BUILDER</span>
        </span></span>
      </h1>
      <div id="who" class="who"></div>
    </div>
    <span class="week-nav" id="week-nav">
      <button id="week-prev" class="week-arrow" type="button" aria-label="Previous week">‹</button>
      <select id="week-select" aria-label="Week"></select>
      <button id="week-next" class="week-arrow" type="button" aria-label="Next week">›</button>
      <button id="back-to-now" class="back-now" type="button" hidden></button>
    </span>
    <div id="sport-switch" class="mode-switch sport-switch" role="tablist" aria-label="League">
      <button type="button" data-sport="nfl">NFL</button>
      <button type="button" data-sport="cfb">CFB</button>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>
  <div id="past-banner" class="past-banner" hidden></div>
  <section id="push-panel" class="card push-panel" hidden></section>

  <section id="login" class="card login" hidden>
    <h2>Log in</h2>
    <form id="login-form" autocomplete="on">
      <label>Username <input name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="small warn-text" hidden></p>
      <button type="submit" class="primary">Log in</button>
    </form>
  </section>

  <section id="join" class="card join" hidden>
    <h2>Who are you?</h2>
    <div id="player-list" class="chips"></div>
    <div id="code-row" class="row" hidden>
      <input id="group-code" placeholder="Group code" autocomplete="off">
      <button id="code-save" type="button">Save code</button>
    </div>
  </section>

  <nav id="tabs" class="tabs" hidden>
    <button data-tab="picks" class="active">Picks</button>
    <button data-tab="board">Board</button>
    <button data-tab="parlays">Parlays</button>
    <button data-tab="slip">Bet Slip</button>
    <button data-tab="stats">Bet Stats</button>
    <button data-tab="analysis">Analysis</button>
    <button data-tab="research"><span id="league-name">NFL</span> <span class="tab-long">Stats/</span>Data</button>
    <button data-tab="heatmap">Heat map <span class="beta">(beta)</span></button>
  </nav>

  <main>
    <section id="tab-picks" class="tab">
      <div id="picks-mode" class="mode-switch" role="tablist">
        <button type="button" data-mode="picks" class="active">My picks</button>
        <button type="button" data-mode="calc">Build a parlay</button>
      </div>
      <p id="picks-hint" class="muted small"></p>
      <p id="schedule-meta" class="muted small meta"></p>
      <div id="games"></div>
    </section>

    <section id="tab-board" class="tab" hidden>
      <div id="board"></div>
    </section>

    <section id="tab-parlays" class="tab" hidden>
      <p id="parlays-hint" class="muted small">👍 or 👎 each parlay (tap again to clear it), and 👎 any leg you don't trust. Put money on the ones you're in on (the person placing bets sees it all on the Bet Slip), or Copy &amp; edit one to make your own version.</p>
      <div id="parlays"></div>
    </section>

    <section id="tab-slip" class="tab" hidden>
      <div id="slip"></div>
    </section>

    <section id="tab-analysis" class="tab" hidden>
      <div id="analysis"></div>
    </section>

    <section id="tab-research" class="tab" hidden>
      <div id="research"></div>
    </section>

    <section id="tab-heatmap" class="tab" hidden>
      <div id="heatmap"></div>
    </section>

    <section id="tab-stats" class="tab" hidden>
      <div id="stats"></div>
    </section>
  </main>

  <div id="submit-bar" class="submit-bar" hidden></div>


  <script src="app.js" type="module"></script>
</body>
</html>
